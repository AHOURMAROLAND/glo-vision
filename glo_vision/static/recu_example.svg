<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond -->
  <rect width="400" height="600" fill="#F5F0E8"/>
  
  <!-- En-tête -->
  <rect x="0" y="0" width="400" height="80" fill="#1A1A2E"/>
  <text x="200" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#F5F0E8">GLO VISION</text>
  <text x="200" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8B7355">PHOTOGRAPHIE</text>
  
  <!-- Ligne dorée -->
  <rect x="50" y="70" width="300" height="3" fill="#C4963A"/>
  
  <!-- Banner Reçu -->
  <rect x="50" y="90" width="300" height="40" fill="#1A1A2E" rx="5"/>
  <text x="200" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">REÇU FINAL — COMMANDE SOLDÉE</text>
  
  <!-- Code commande -->
  <text x="200" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#C4963A">Code commande : GLO-A1B2C3D4</text>
  <text x="200" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">Date : 27/03/2026 à 09:17</text>
  
  <!-- Infos client -->
  <g id="client-info">
    <rect x="50" y="200" width="300" height="120" fill="#F5F0E8" stroke="#E0D8CC" stroke-width="1"/>
    
    <text x="60" y="220" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">CLIENT</text>
    <text x="250" y="220" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1A1A2E">Roland Ahourma</text>
    
    <text x="60" y="245" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">WHATSAPP</text>
    <text x="250" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1A1A2E">22890123456</text>
    
    <text x="60" y="270" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">TABLEAU</text>
    <text x="250" y="270" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1A1A2E">Portrait Familial</text>
    
    <text x="60" y="295" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">QUANTITÉ</text>
    <text x="250" y="295" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1A1A2E">2</text>
  </g>
  
  <!-- Lignes séparatrices -->
  <rect x="50" y="330" width="300" height="1" fill="#E0D8CC"/>
  <rect x="50" y="440" width="300" height="1" fill="#C4963A"/>
  
  <!-- Montants -->
  <g id="montants">
    <text x="60" y="360" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">Acompte déjà payé</text>
    <text x="340" y="360" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2A7A2A">25 000 FCFA</text>
    
    <text x="60" y="390" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">Solde payé aujourd'hui</text>
    <text x="340" y="390" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#C4963A">25 000 FCFA</text>
    
    <text x="60" y="420" font-family="Arial, sans-serif" font-size="10" fill="#8B7355">TOTAL PAYÉ</text>
    <text x="340" y="420" text-anchor="end" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1A1A2E">50 000 FCFA</text>
  </g>
  
  <!-- Message final -->
  <text x="200" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1A1A2E">Commande clôturée — Merci pour votre confiance !</text>
  <text x="200" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B7355">Votre tableau a été réalisé avec soin. Revenez nous voir bientôt !</text>
  
  <!-- Footer -->
  <text x="200" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B7355">Glo Vision — Photographie professionnelle — Lomé, Togo</text>
</svg>
