# Evolution API pour Render.com
# Ce fichier docker-compose peut être adapté pour Render

services:
  evolution-api:
    image: atendai/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=https://ton-app-evolution.onrender.com
      - AUTHENTICATION_API_KEY=ta_cle_secrete_tres_longue_et_aleatoire
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://user:pass@db:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_LOGS=true
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - evolution-network

volumes:
  evolution_data:
    driver: local

networks:
  evolution-network:
    driver: bridge
