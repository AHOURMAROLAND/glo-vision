{
  "services": [
    {
      "type": "web",
      "name": "evolution-api",
      "runtime": "docker",
      "plan": "standard",
      "region": "frankfurt",
      "dockerContext": ".",
      "dockerfilePath": "./Dockerfile",
      "envVars": [
        {
          "key": "SERVER_URL",
          "value": "https://evolution-api-ton-projet.onrender.com"
        },
        {
          "key": "AUTHENTICATION_API_KEY",
          "generateValue": true
        },
        {
          "key": "DATABASE_ENABLED",
          "value": "false"
        },
        {
          "key": "DATABASE_PROVIDER",
          "value": "postgresql"
        }
      ],
      "disk": {
        "name": "evolution-data",
        "mountPath": "/evolution/instances",
        "sizeGB": 1
      }
    }
  ]
}
